<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <!-- Rich deep forest-green gradient (light top-left → dark bottom-right) -->
    <linearGradient id="forestGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2e7d32"/>
      <stop offset="60%"  stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#145214"/>
    </linearGradient>

    <!-- Soft glow / shadow for depth -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#0a2e0a" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to keep things tidy -->
    <clipPath id="viewClip">
      <rect x="0" y="0" width="800" height="800"/>
    </clipPath>
  </defs>

  <!--
    Strategy: Reproduce the exact geometry of the uploaded logo.
    
    The uploaded logo is a bold ITALIC "E" where:
    - The letter forms a nearly complete filled shape
    - Top bar spans nearly full width
    - Middle bar is slightly shorter (about 70% of top width)
    - Bottom bar is same width as top
    - Two rectangular-ish NOTCHES are cut in on the right side 
      (between top & middle, and between middle & bottom bars)
    - The overall silhouette leans ~15° to the right (italic)
    - Outer shape is close to a parallelogram / rounded diamond
    
    Implementation: Use polygon with evenodd winding to cut notches.
    Coordinates are for an 800x800 viewBox.
  -->
  <g filter="url(#logoShadow)" clip-path="url(#viewClip)">
    <path
      fill="url(#forestGreen)"
      fill-rule="evenodd"
      d="
        M 660,65
        L 195,65
        L 130,735
        L 595,735
        Z

        M 596,145
        L 272,145
        L 250,310
        L 578,310
        Z

        M 558,395
        L 237,395
        L 214,555
        L 542,555
        Z
      "
    />
  </g>
</svg>
